# ═══════════════════════════════════════════════════════════════════════
#  Production docker-compose for BasicChatApi (Ubuntu / cloud server)
#  ⚠ NOT for local development — use docker-compose.yml for that
#
#  Start:
#    1) cp .env.prod.example .env.prod          # fill in strong secrets
#    2) docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
#
#  Stop:
#    docker compose --env-file .env.prod -f docker-compose.prod.yml down
#
#  Logs:
#    docker compose -f docker-compose.prod.yml logs -f basicapi
#
#  Only 80/443 (Caddy) are open to the outside. The API and Postgres live in internal networks.
#
#  Memory: the limits add up to 1 GB — a small server, up to ~100 clients online
#  (docs/capacity-and-limits.md). For more, raise *_MEMORY in .env.prod.
#  Before the first start: the DOMAIN DNS record points to the server and ports 80 and 443
#  are open — otherwise Let's Encrypt will not issue a certificate.
# ═══════════════════════════════════════════════════════════════════════

name: basicchat

services:
  postgres:
    # ✅ ALWAYS a pinned version, not :latest — otherwise a "surprise" upgrade
    #    can take the database down or break compatibility.
    image: postgres:17-alpine
    container_name: basicchat_postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}

    # Sized for the memory limit below: shared_buffers is the main fixed cost, and each of
    # max_connections may become a process of its own. The API's pool takes at most 10.
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=30"]

    # 🚨 Postgres is NOT published. The database is reachable ONLY inside the docker network.
    #    Internet scanners knock on 5432 — give them no chance at all.
    #    If you need access from the host (backups, psql), uncomment and bind to
    #    loopback:  ports: ["127.0.0.1:5432:5432"]

    volumes:
      # ✅ The correct data path (not /var/lib/postgresql!) — otherwise with newer
      #    images the data is not initialized or breaks on upgrade.
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s

    shm_size: "64mb"

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW
      - NET_ADMIN
      - SYS_PTRACE
      - SYS_ADMIN
      - SYS_MODULE
      - SYS_CHROOT
      - SYS_RAWIO

    logging:
      driver: json-file
      options:
        max-size: "10m"     # 🛡 keep logs from filling the disk
        max-file: "3"

    deploy:
      resources:
        limits:             # 🛡 protect the server from overload
          cpus: "1.0"
          memory: ${POSTGRES_MEMORY:-288M}
          pids: 100
        reservations:
          memory: 128M

    networks:
      - chat_network

  basicapi:
    build:
      context: .
      dockerfile: BasicApi/Dockerfile
    image: basicapi:latest
    container_name: basicchat_api
    restart: unless-stopped

    # 🛡 reaps zombies + non-root user (1654 = 'app' in the .NET image)
    init: true
    user: "1654:1654"

    environment:
      ASPNETCORE_ENVIRONMENT: Production     # ✅ NOT Development!
      ASPNETCORE_URLS: http://+:8080
      # Maximum Pool Size well below Postgres max_connections (30): under a peak
      # queries wait in the pool queue instead of being refused by the server (capacity-and-limits.md).
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD};Timeout=15;Command Timeout=30;Pooling=true;Maximum Pool Size=${DB_POOL_SIZE:-10}"
      # A small heap rather than speed: workstation GC, and the runtime gives memory back sooner.
      DOTNET_gcServer: "0"
      DOTNET_GCConserveMemory: "5"
      Jwt__Key: ${JWT_KEY}                   # 🛡 a strong secret, not the default
      Jwt__Issuer: ${JWT_ISSUER:-ChatApi}
      Jwt__Audience: ${JWT_AUDIENCE:-ChatClient}
      Jwt__ExpiryMinutes: ${JWT_EXPIRY_MINUTES:-60}
      AllowedHosts: ${ALLOWED_HOSTS:-*}
      # Swagger UI and the API schema; off by default in production.
      Swagger__Enabled: ${SWAGGER_ENABLED:-false}
      # Trust X-Forwarded-For only from Caddy: its edge network has a fixed subnet.
      ReverseProxy__TrustedNetworks: ${PROXY_SUBNET:-172.30.0.0/24}
      # The frontend is served by the API itself (wwwroot/client), so cross-origin
      # access with credentials is not needed by default. Fill in only if you call
      # the API from a separate domain/port.
      Cors__AllowedOrigins: ${ALLOWED_ORIGINS:-}
      # Files: the API talks to the storage inside the docker network and signs links for
      # the site's own address — Caddy passes /media/ to the storage (plan 2, F4).
      Storage__Endpoint: http://seaweedfs:8333
      Storage__PublicUrl: ${PUBLIC_URL:-https://${DOMAIN}}
      Storage__Bucket: media
      Storage__AccessKey: ${STORAGE_ACCESS_KEY}
      Storage__SecretKey: ${STORAGE_SECRET_KEY}
      # Push notifications (plan 2, F7): off while the keys are empty. The API reaches the
      # push services (Google, Mozilla, Microsoft, Apple) through the edge network.
      Push__VapidPublicKey: ${PUSH_VAPID_PUBLIC_KEY:-}
      Push__VapidPrivateKey: ${PUSH_VAPID_PRIVATE_KEY:-}
      Push__Subject: ${PUSH_SUBJECT:-https://${DOMAIN}}

    # No published ports: all traffic goes through Caddy over the edge network.
    expose:
      - "8080"

    # 🛡 read-only rootfs + tmpfs for temporary files
    read_only: true
    tmpfs:
      - /tmp:size=16m
      # Owned by the app user: a root-owned tmpfs made Data Protection log an Error
      # on every restart (it could not write its key ring).
      - /home/app/.aspnet/DataProtection-Keys:uid=1654,gid=1654,mode=0700

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy

    healthcheck:
      # HTTP readiness check (application + database). The .NET image has no curl/wget,
      # so bash writes the request to a socket and waits for status 200.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: ${API_MEMORY:-256M}
          pids: 200
        reservations:
          memory: 96M

    networks:
      - chat_network
      - edge

  # File storage with the S3 API (SeaweedFS: MinIO stopped publishing community builds).
  # Not published: clients reach it only through Caddy at /media/, by links the API signs.
  seaweedfs:
    image: chrislusf/seaweedfs:4.47
    container_name: basicchat_seaweedfs
    restart: unless-stopped
    command: ["mini", "-dir=/data", "-webdav=false", "-admin.ui=false", "-s3.port.iceberg=0",
              "-s3.port.lance=0", "-master.telemetry=false",
              "-s3.externalUrl=${PUBLIC_URL:-https://${DOMAIN}}", "-s3.allowedOrigins=${PUBLIC_URL:-https://${DOMAIN}}"]
    environment:
      AWS_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_SECRET_KEY}
      # Go does not see the container's limit: a 60 MB upload next to others made the heap outgrow
      # 256M, and the kernel killed the storage. A soft limit of its own (~80% of STORAGE_MEMORY)
      # makes the collector work harder instead.
      GOMEMLIMIT: ${STORAGE_GOMEMLIMIT:-256MiB}
    volumes:
      - media_data:/data     # the files themselves — back up together with the database
    tmpfs:
      - /tmp:size=64m

    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

    security_opt:
      - no-new-privileges:true
    # The entrypoint fixes /data ownership and drops to the seaweed user.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: ${STORAGE_MEMORY:-320M}
          pids: 200
        reservations:
          memory: 64M

    networks:
      - chat_network
      - edge

  caddy:
    image: caddy:2.10-alpine
    container_name: basicchat_caddy
    restart: unless-stopped

    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}

    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"     # HTTP/3

    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data         # certificates and ACME keys — do not lose
      - caddy_config:/config

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

    depends_on:
      basicapi:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # Caddy needs ~220-250 KB of memory per open WebSocket. With 128M, 1000 clients
    # drove it into constant GC at its CPU limit (latency x4) and to the edge of an
    # OOM kill (docs/load-testing.md). 160M is for ~100-300 clients; 512M — for ~2000.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: ${CADDY_MEMORY:-160M}
          pids: 100

    networks:
      - edge

volumes:
  postgres_data:
    name: basicchat_postgres_data
  caddy_data:
    name: basicchat_caddy_data
  caddy_config:
    name: basicchat_caddy_config
  media_data:
    name: basicchat_media_data
  # Data Protection keys live in tmpfs and are recreated on restart.
  # That is safe for JWT auth (tokens are self-contained).

networks:
  # Database and API. internal: no way out of this network.
  chat_network:
    driver: bridge
    internal: true
  # Caddy ↔ API. The subnet is fixed: the application trusts proxy headers only from it.
  edge:
    driver: bridge
    ipam:
      config:
        - subnet: ${PROXY_SUBNET:-172.30.0.0/24}
