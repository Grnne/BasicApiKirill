# ═══════════════════════════════════════════════════════════════════════
#  Production docker-compose for BasicChatApi (Ubuntu / cloud server)
#  ⚠ НЕ использовать для локальной разработки — для этого есть docker-compose.yml
#
#  Запуск:
#    1) cp .env.prod.example .env.prod          # заполнить сильные секреты
#    2) docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
#
#  Остановка:
#    docker compose --env-file .env.prod -f docker-compose.prod.yml down
#
#  Логи:
#    docker compose -f docker-compose.prod.yml logs -f basicapi
#
#  Снаружи открыты только 80/443 (Caddy). API и Postgres — во внутренних сетях.
#  Перед первым запуском: DNS-запись DOMAIN указывает на сервер, порты 80 и 443
#  открыты — иначе Let's Encrypt не выдаст сертификат.
# ═══════════════════════════════════════════════════════════════════════

name: basicchat

services:
  postgres:
    # ✅ ВСЕГДА пиннутая версия, а не :latest — иначе «внезапное» обновление
    #    может уронить БД или сломать совместимость.
    image: postgres:17-alpine
    container_name: basicchat_postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}

    # 🚨 НЕ публикуем Postgres наружу. БД доступна ТОЛЬКО внутри docker-сети.
    #    Сканеры в интернете стучатся по 5432 — не даём им ни единого шанса.
    #    Если нужен доступ с хоста (бэкапы, psql) — разкомментируй и забиндь
    #    на loopback:  ports: ["127.0.0.1:5432:5432"]

    volumes:
      # ✅ Правильный путь данных (не /var/lib/postgresql!) — иначе в новых
      #    образах данные не инициализируются или ломаются при обновлении.
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s

    shm_size: "256mb"

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW
      - NET_ADMIN
      - SYS_PTRACE
      - SYS_ADMIN
      - SYS_MODULE
      - SYS_CHROOT
      - SYS_RAWIO

    logging:
      driver: json-file
      options:
        max-size: "10m"     # 🛡 не даём логам забить диск
        max-file: "3"

    deploy:
      resources:
        limits:             # 🛡 защита от перегруза сервера
          cpus: "1.0"
          memory: 768M
          pids: 100
        reservations:
          memory: 256M

    networks:
      - chat_network

  basicapi:
    build:
      context: .
      dockerfile: BasicApi/Dockerfile
    image: basicapi:latest
    container_name: basicchat_api
    restart: unless-stopped

    # 🛡 reaps zombies + non-root user (1654 = 'app' в .NET-образе)
    init: true
    user: "1654:1654"

    environment:
      ASPNETCORE_ENVIRONMENT: Production     # ✅ НЕ Development!
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD};Timeout=15;Command Timeout=30;Pooling=true"
      Jwt__Key: ${JWT_KEY}                   # 🛡 сильный секрет, не дефолтный
      Jwt__Issuer: ${JWT_ISSUER:-ChatApi}
      Jwt__Audience: ${JWT_AUDIENCE:-ChatClient}
      Jwt__ExpiryMinutes: ${JWT_EXPIRY_MINUTES:-60}
      AllowedHosts: ${ALLOWED_HOSTS:-*}
      # Swagger UI и схема API; в проде по умолчанию выключены.
      Swagger__Enabled: ${SWAGGER_ENABLED:-false}
      # Доверять X-Forwarded-For только от Caddy: его сеть edge с фиксированной подсетью.
      ReverseProxy__TrustedNetworks: ${PROXY_SUBNET:-172.30.0.0/24}
      # Фронтенд отдаётся тем же API (wwwroot/app), поэтому по умолчанию
      # cross-origin доступ с credentials не нужен. Заполняй, только если
      # ходишь на API с отдельного домена/порта.
      Cors__AllowedOrigins: ${ALLOWED_ORIGINS:-}

    # Портов наружу нет: весь трафик идёт через Caddy по сети edge.
    expose:
      - "8080"

    # 🛡 read-only rootfs + tmpfs для временных файлов
    read_only: true
    tmpfs:
      - /tmp:size=64m
      - /home/app/.aspnet/DataProtection-Keys

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      # HTTP-проверка готовности (приложение + база). curl/wget в .NET-образе нет,
      # поэтому запрос пишем в сокет средствами bash и ждём статус 200.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
          pids: 200
        reservations:
          memory: 128M

    networks:
      - chat_network
      - edge

  caddy:
    image: caddy:2.10-alpine
    container_name: basicchat_caddy
    restart: unless-stopped

    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}

    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"     # HTTP/3

    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data         # сертификаты и ключи ACME — не терять
      - caddy_config:/config

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

    depends_on:
      basicapi:
        condition: service_healthy

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
          pids: 100

    networks:
      - edge

volumes:
  postgres_data:
    name: basicchat_postgres_data
  caddy_data:
    name: basicchat_caddy_data
  caddy_config:
    name: basicchat_caddy_config
  # Data Protection keys живут в tmpfs — при рестарте пересоздаются.
  # Для JWT-авторизации это безопасно (токены самодостаточные).

networks:
  # База и API. internal: из этой сети нет выхода наружу.
  chat_network:
    driver: bridge
    internal: true
  # Caddy ↔ API. Подсеть фиксирована: приложение доверяет заголовкам прокси только из неё.
  edge:
    driver: bridge
    ipam:
      config:
        - subnet: ${PROXY_SUBNET:-172.30.0.0/24}
