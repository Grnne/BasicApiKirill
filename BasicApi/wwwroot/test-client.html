<!DOCTYPE html>
<html>
<head>
    <title>Chat Test Client</title>
    <script src="/signalr.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #000000;
            color: #22cc22;
            font-family: 'Courier New', 'Consolas', 'Monaco', monospace;
            padding: 24px;
            max-width: 900px;
            margin: 0 auto;
        }
        h2 {
            color: #22cc22;
            margin-bottom: 20px;
            font-weight: 400;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 8px rgba(34, 204, 34, 0.2);
        }
        h2::before { content: "> "; }
        h3 {
            color: #22cc22;
            margin-bottom: 8px;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.6;
        }
        h3::before { content: "# "; }
        .section {
            background: #050505;
            border: 1px solid #113311;
            padding: 16px;
            margin-bottom: 16px;
        }
        input {
            background: #000000;
            border: 1px solid #113311;
            padding: 10px 14px;
            color: #22cc22;
            font-size: 14px;
            font-family: 'Courier New', 'Consolas', monospace;
            outline: none;
        }
        input:focus { border-color: #22cc22; }
        input::placeholder { color: #2c862c; }
        #token { width: 100%; margin-bottom: 10px; }
        .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        #chatId, #message { flex: 1; min-width: 200px; }
        button {
            background: #000000;
            color: #22cc22;
            border: 1px solid #113311;
            padding: 10px 18px;
            font-size: 13px;
            font-family: 'Courier New', 'Consolas', monospace;
            cursor: pointer;
            transition: all 0.15s;
            white-space: nowrap;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        button:hover { background: #112211; border-color: #22cc22; color: #33ff33; }
        #status {
            color: #882222;
            font-size: 13px;
            margin-left: auto;
            font-family: 'Courier New', monospace;
        }
        #status.connected { color: #22cc22; }
        #messages {
            background: #020202;
            border: 1px solid #113311;
            height: 300px;
            overflow-y: auto;
            padding: 12px;
            font-size: 14px;
            line-height: 1.6;
            font-family: 'Courier New', 'Consolas', monospace;
        }
        #messages div {
            padding: 4px 8px;
            border-bottom: 1px solid #060606;
        }
        #messages div:nth-child(odd) { background: #123112; }
        #messages small { color: #0a330a; font-size: 11px; }
        #events {
            background: #020202;
            border: 1px solid #113311;
            height: 400px;
            overflow-y: auto;
            padding: 12px;
            font-size: 12px;
            line-height: 1.5;
            font-family: 'Courier New', 'Consolas', monospace;
        }
        .ev-timestamp { color: #0a330a; }
        #events .ev-row { color: #cccc33; }
        #events .ev-row-message { color: #22cc22; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #000000; }
        ::-webkit-scrollbar-thumb { background: #113311; }
        ::selection { background: #22cc22; color: #000000; }
    </style>
</head>
<body>
    <h2>💬 Chat Test Client</h2>

    <div class="section">
        <h3>Auth</h3>
        <input type="text" id="token" placeholder="JWT Token" onkeydown="if(event.key==='Enter') connect()" />
        <div class="row">
            <button onclick="connect()">Connect</button>
            <button onclick="disconnect()">Disconnect</button>
            <span id="status">Disconnected</span>
        </div>
    </div>

    <div class="section">
        <h3>Chat</h3>
        <div class="row">
            <input type="text" id="chatId" placeholder="Chat ID" onkeydown="if(event.key==='Enter') joinChat()" />
            <button onclick="joinChat()">Join Chat</button>
            <button onclick="leaveChat()">Leave Chat</button>
        </div>
        <div class="row" style="margin-top:10px">
            <input type="text" id="message" placeholder="Message" onkeydown="if(event.key==='Enter') sendMessage()" />
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <div class="section">
        <h3>Messages</h3>
        <div id="messages"></div>
    </div>

    <div class="section">
        <h3>Events Log</h3>
        <div id="events"></div>
    </div>

    <script>
        let connection = null;
        let eventCount = 0;

        function logEvent(type, className, ...args) {
            eventCount++;
            const div = document.getElementById('events');
            const time = new Date().toLocaleTimeString();
            const text = args.map(a => JSON.stringify(a, null, 1)).join(', ').replace(/\n/g, ' ');
            const row = document.createElement('div');
            row.className = className || 'ev-row';
            row.innerHTML = `<span class="ev-timestamp">[${time}]</span> ${type}: ${text}`;
            div.appendChild(row);
            div.scrollTop = div.scrollHeight;
        }

        function connect() {
            const token = document.getElementById('token').value;
            if (!token) {
                alert('Enter token');
                return;
            }

            const baseUrl = window.location.origin;
            const hubUrl = `${baseUrl}/hubs/chat`;

            console.log('Connecting to:', hubUrl);

            connection = new signalR.HubConnectionBuilder()
                .withUrl(hubUrl, {
                    accessTokenFactory: () => token,
                    transport: signalR.HttpTransportType.WebSockets
                })
                .withAutomaticReconnect()
                .build();

            connection.on("MessageCreated", (message) => {
                logEvent("MessageCreated", "message-created", message);
                const div = document.getElementById('messages');
                div.innerHTML += `<div><b>${message.senderName}:</b> ${message.text} <small>(${new Date(message.createdAt).toLocaleTimeString()})</small></div>`;
                div.scrollTop = div.scrollHeight;
            });

            connection.on("ChatListUpdated", (chatId, message) => {
                logEvent("ChatListUpdated", "chat-list-updated", { chatId, message });
            });

            connection.on("TypingChanged", (chatId, userId, isTyping) => {
                logEvent("TypingChanged", "typing", { chatId, userId, isTyping });
            });

            connection.on("UserOnlineChanged", (userId, isOnline) => {
                logEvent("UserOnlineChanged", "online", { userId, isOnline });
            });

            connection.start()
                .then(() => {
                    document.getElementById('status').innerText = 'Connected';
                    document.getElementById('status').className = 'connected';
                    console.log('Connected!');
                })
                .catch(err => {
                    console.error('Connection error:', err);
                    alert('Connection failed: ' + err);
                });
        }

        function disconnect() {
            if (connection) {
                connection.stop();
                connection = null;
                document.getElementById('status').innerText = 'Disconnected';
                document.getElementById('status').className = '';
            }
        }

        function joinChat() {
            const chatId = document.getElementById('chatId').value;
            if (connection && chatId) {
                connection.invoke("JoinChat", chatId).catch(err => console.error(err));
                console.log('Joined chat:', chatId);
            }
        }

        function leaveChat() {
            const chatId = document.getElementById('chatId').value;
            if (connection && chatId) {
                connection.invoke("LeaveChat", chatId).catch(err => console.error(err));
            }
        }

        function sendMessage() {
            const chatId = document.getElementById('chatId').value;
            const message = document.getElementById('message').value;
            if (connection && chatId && message) {
                connection.invoke("SendMessage", chatId, message).catch(err => console.error(err));
                document.getElementById('message').value = '';
            }
        }
    </script>
</body>
</html>
