<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Dev server only: the build drops this tag (vite.config.ts, devOnlyCsp) and the API sends
      the same policy as a header, with the file storage origin added.
      connect-src 'self': even with XSS a script cannot send the token to another host;
      ws:/wss: — the hub and Vite's HMR channel. 'unsafe-inline' is for Vue's <style> tags only.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' ws: wss:; base-uri 'none'; object-src 'none'"
    />
    <title>Basic Chat</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
