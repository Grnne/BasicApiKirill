services:
  postgres:
    image: postgres:latest
    container_name: chat_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql 
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
    networks:
      - chat_network

  # File storage with the S3 API (plan 2, F4). The browser uploads and downloads by signed
  # links straight from here, so the port is published: http://localhost:8333.
  seaweedfs:
    image: chrislusf/seaweedfs:4.47
    container_name: chat_seaweedfs
    command: ["mini", "-dir=/data", "-webdav=false", "-admin.ui=false", "-s3.port.iceberg=0",
              "-s3.port.lance=0", "-master.telemetry=false"]
    environment:
      AWS_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY:-dev-media}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_SECRET_KEY:-dev-media-secret-do-not-use-in-production}
    ports:
      - "${STORAGE_PORT:-8333}:8333"
    volumes:
      - media_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
    networks:
      - chat_network

  basicapi:
    build:
      context: .
      dockerfile: BasicApi/Dockerfile
    container_name: basicapi
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=${DB_NAME:-postgres};Username=${DB_USER:-postgres};Password=${DB_PASSWORD:-postgres};Maximum Pool Size=30
      - Storage__Endpoint=http://seaweedfs:8333
      - Storage__PublicUrl=http://localhost:${STORAGE_PORT:-8333}
      - Storage__AccessKey=${STORAGE_ACCESS_KEY:-dev-media}
      - Storage__SecretKey=${STORAGE_SECRET_KEY:-dev-media-secret-do-not-use-in-production}
    ports:
      - "${HOST_PORT:-8080}:8080"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
      - ${APPDATA}/ASP.NET/Https:/root/.aspnet/https:ro
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    healthcheck:
      # Same as in docker-compose.prod.yml: an HTTP request to /health/ready made with bash.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - chat_network

volumes:
  postgres_data:
    name: chat_postgres_data
  media_data:
    name: chat_media_data

networks:
  chat_network:
    driver: bridge